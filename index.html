<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Эра гаджетов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#FFFFFF; --muted:#9AA4B2; --surface:#1A1F27; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0E1116;color:var(--ink);
    font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;padding:6px;gap:8px;touch-action:none;user-select:none;
    position:relative;overflow:hidden;}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:linear-gradient(rgba(70,110,160,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(70,110,160,.05) 1px,transparent 1px);background-size:36px 36px;}
  body::after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at 25% 18%,rgba(34,211,238,.16),transparent 40%),
      radial-gradient(circle at 82% 82%,rgba(59,130,246,.15),transparent 42%);
    animation:drift 20s ease-in-out infinite alternate;}
  @keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,3%) scale(1.1)}}
  .hud{width:100%;max-width:400px;display:flex;align-items:flex-end;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:9px;font-family:"Onest",system-ui;font-weight:800;font-size:18px;color:#fff;letter-spacing:-.2px;}
  .brand .mark{width:34px;height:22px;fill:#22D3EE;filter:drop-shadow(0 0 8px rgba(34,211,238,.55));}
  .brand span{display:block;line-height:1.05;}
  .brand small{display:block;font-size:9.5px;font-weight:600;letter-spacing:2.4px;color:#22D3EE;margin-top:3px;}
  .cta{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:14px;padding-top:12px;
    border-top:1px solid #262E3A;width:100%;text-decoration:none;}
  .cta .t1{font-size:12px;color:#9AA4B2;}
  .cta .t2{font-size:14px;font-weight:700;color:#22D3EE;}
  .panel{background:rgba(26,31,39,.75);border:1px solid #262E3A;border-radius:12px;
    padding:6px 12px 7px;text-align:right;min-width:118px;
    box-shadow:inset 0 0 12px rgba(34,211,238,.08),0 2px 8px rgba(0,0,0,.4);}
  .panel .lbl{font-size:9px;letter-spacing:2px;color:#5c6a80;font-weight:600;}
  .panel .val{font-family:"Onest",system-ui;font-variant-numeric:tabular-nums;font-weight:800;font-size:26px;color:#22D3EE;
    line-height:1.05;text-shadow:0 0 10px rgba(34,211,238,.55);}
  .panel .rec{font-size:10px;color:#7a869c;margin-top:1px;}
  .panel .rec b{color:#3B82F6;font-family:"Onest",system-ui;font-variant-numeric:tabular-nums;font-weight:700;}
  .stage{position:relative;border-radius:20px;overflow:hidden;
    box-shadow:0 0 0 1px #262E3A,0 0 40px rgba(34,211,238,.10),0 18px 50px rgba(0,0,0,.6);}
  canvas{display:block;touch-action:none;}
  .over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(9,10,16,.9);backdrop-filter:blur(4px);}
  .over .card{background:rgba(26,31,39,.92);border:1px solid #262E3A;border-radius:18px;
    padding:22px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:inset 0 0 22px rgba(34,211,238,.06),0 12px 44px rgba(0,0,0,.6);}
  .over h2{margin:0 0 2px;font-family:"Onest",system-ui;font-weight:800;font-size:24px;color:#ff5a6e;
    text-shadow:0 0 14px rgba(255,90,110,.35);}
  .ovimg{width:150px;height:auto;margin:-78px 0 4px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.6));}
  .over .badge{font-family:"Onest",system-ui;font-weight:800;font-size:11px;color:#0E1116;background:#ffd23c;
    padding:4px 14px;border-radius:20px;letter-spacing:1px;box-shadow:0 0 16px rgba(255,210,60,.55);}
  .over .lbl{font-size:9px;letter-spacing:2px;color:#5c6a80;font-weight:600;margin-top:8px;}
  .over .big{font-family:"Onest",system-ui;font-variant-numeric:tabular-nums;font-weight:800;font-size:46px;color:#22D3EE;
    line-height:1;text-shadow:0 0 18px rgba(34,211,238,.6);}
  .over .sub{font-size:12px;color:#8a94a8;margin-top:2px;}
  .over .sub b{color:#3B82F6;}
  .over .btn{margin-top:12px;}
  .btn{border:none;border-radius:14px;padding:13px 28px;font-size:16px;font-weight:700;
    font-family:"Onest",system-ui;color:#0E1116;
    background:linear-gradient(135deg,#22D3EE,#3B82F6);cursor:pointer;box-shadow:0 0 18px rgba(34,211,238,.35);}
  .btn:active{transform:scale(.97);box-shadow:0 0 8px rgba(34,211,238,.3);}
  .hint{font-size:11px;color:var(--muted);max-width:400px;text-align:center;}
  .ctrls{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:5;}
  .ic{width:36px;height:36px;background:rgba(20,22,32,.7);border:1px solid #2a2d3a;border-radius:10px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#22D3EE;}
  .ic.off{color:#5f6270;}
  .powers{position:absolute;right:10px;top:54px;z-index:5;display:none;flex-direction:row;gap:8px;}
  .pw{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;
    background:rgba(26,31,39,.85);border:1px solid #262E3A;border-radius:12px;color:#22D3EE;cursor:pointer;
    box-shadow:inset 0 0 10px rgba(34,211,238,.08);transition:transform .12s;}
  .pw svg{width:20px;height:20px;}
  .pw b{position:absolute;right:-5px;bottom:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:linear-gradient(135deg,#22D3EE,#3B82F6);color:#0E1116;font:800 10.5px/17px "Onest",system-ui;}
  .pw.on{background:linear-gradient(135deg,#22D3EE,#3B82F6);color:#0E1116;box-shadow:0 0 18px rgba(34,211,238,.65);transform:scale(1.06);}
  .pw.on b{background:#0E1116;color:#22D3EE;}
  .pw.empty{color:#4a5363;}
  .pw.empty b{background:#2A313D;color:#6b7585;}
  .pw:active{transform:scale(.94);}
  .board{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(9,10,16,.93);backdrop-filter:blur(4px);z-index:6;}
  .board .card{background:rgba(26,31,39,.96);border:1px solid #262E3A;border-radius:18px;padding:18px 20px;
    width:min(88%,330px);display:flex;flex-direction:column;gap:12px;
    box-shadow:inset 0 0 22px rgba(34,211,238,.06),0 12px 44px rgba(0,0,0,.6);}
  .board h3{margin:0;text-align:center;font-family:"Onest",system-ui;font-weight:800;font-size:18px;color:#22D3EE;
    text-shadow:0 0 12px rgba(34,211,238,.3);}
  .board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:44vh;overflow-y:auto;}
  .board li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid #202a38;
    border-radius:10px;padding:7px 10px;font-size:14px;}
  .board li.me{border-color:#22D3EE;box-shadow:0 0 10px rgba(34,211,238,.25);}
  .board li .rk{width:24px;text-align:center;font-weight:700;color:#7a869c;}
  .board li .nm{flex:1;color:#e6edf6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .board li .sc{font-family:"Onest",system-ui;font-variant-numeric:tabular-nums;font-weight:700;color:#22D3EE;}
  .board .empty{color:#8a94a8;font-size:13px;text-align:center;padding:12px;line-height:1.5;}
  .board input{background:#0e1017;border:1px solid #2a3547;border-radius:10px;padding:9px 12px;color:#e6edf6;
    font-family:"Onest",system-ui;font-size:14px;width:100%;}
  .board input{-webkit-user-select:text;user-select:text;touch-action:auto;}
  .board input:focus{outline:none;border-color:#22D3EE;}
  .pmenu{display:flex;flex-direction:column;gap:9px;margin-top:14px;width:230px;}
  .pmenu .btn{width:100%;}
  #pauseOv{z-index:4;}
  .ovbtns{display:flex;gap:8px;margin-top:10px;}
  .btn.ghost{background:transparent;color:#22D3EE;border:1.5px solid #22D3EE;box-shadow:none;}
  .btn.ghost:active{transform:translateY(1px);box-shadow:none;}
</style>
</head>
<body>
  <div class="hud">
    <div class="brand"><svg class="mark" id="brandMark" viewBox="0 0 200 128"></svg><div><span>TechGigant</span><small>ЭРА ГАДЖЕТОВ</small></div></div>

    <div class="powers" id="powers">
      <button class="pw" data-p="del" aria-label="Утилизация"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg><b>1</b></button>
      <button class="pw" data-p="shake" aria-label="Встряска"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8M1.5 10v4M22.5 10v4"/></svg><b>1</b></button>
      <button class="pw" data-p="up" aria-label="Апгрейд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l6-6 6 6M6 19l6-6 6 6"/></svg><b>0</b></button>

    <div class="ctrls">
      <button class="ic" id="pauseBtn" aria-label="Пауза" style="display:none"></button>
      <button class="ic" id="lb" aria-label="Топ игроков" style="display:none"></button>
      <button class="ic" id="mus" aria-label="Музыка"></button>

  <div class="hint">Сливай одинаковые — дойди до раритета. Справа суперспособности.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const {Engine,Bodies,Composite,Events,Body,Query}=Matter;
const W=400,PI=Math.PI;
// высота поля под форму экрана: от 600 (как было) до 780 на вытянутых телефонах
const H=(()=>{const aw=Math.min(window.innerWidth-12,520),ah=window.innerHeight-112;return Math.round(Math.max(600,Math.min(780,W*ah/aw)));})();
const OY=(H-600)/2; // стартовый экран держим по центру
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function fit(){const hud=document.querySelector('.hud'),hint=document.querySelector('.hint');
  const mw=Math.min(window.innerWidth-12,520),mh=window.innerHeight-(hud?hud.offsetHeight:60)-(hint?hint.offsetHeight:16)-36;
  let cw=mw,ch=cw*(H/W);if(ch>mh){ch=mh;cw=ch*(W/H);}
  const k=cw/W*Math.min(window.devicePixelRatio||1,3);canvas.width=Math.round(W*k);canvas.height=Math.round(H*k);
  canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(k,0,0,k,0,0);
  if(hud)hud.style.maxWidth=cw+'px';if(hint)hint.style.maxWidth=cw+'px';}
window.addEventListener('resize',fit);fit();
// ---------- ЛОГО TechGigant (вектор 200x128) ----------
const LOGO_D='M19.4 125.4C13.7 123.4 8.0 118.2 4.5 111.9C-1.3 101.3 1.3 86.0 10.2 78.5C14.9 74.5 20.1 72.5 32.0 70.0C57.6 64.6 64.8 57.8 70.6 33.3C74.7 15.8 78.1 9.7 86.3 5.0C109.1 -8.0 134.9 15.8 124.6 40.4C122.7 45.0 117.3 50.8 112.9 53.1C110.8 54.1 103.3 56.4 96.3 58.1C68.8 64.6 63.2 70.1 57.0 96.7C53.3 112.0 50.4 117.5 43.3 122.0C35.2 127.2 27.5 128.2 19.4 125.4ZM93.0 126.1C85.7 123.9 79.9 118.7 75.9 111.0C72.6 104.7 72.5 92.4 75.7 86.4C80.5 77.4 88.1 73.1 105.7 69.4C129.3 64.5 136.3 57.6 142.4 32.9C147.7 10.9 154.0 3.4 168.7 1.4C192.2 -1.7 208.1 28.5 192.5 46.7C187.8 52.2 181.0 55.4 166.7 58.5C152.0 61.8 147.3 63.7 141.4 69.2C135.2 74.9 132.5 80.6 129.0 95.6C125.5 110.2 122.1 117.2 116.6 121.2C109.9 126.0 99.7 128.1 93.0 126.1ZM156.5 122.2C145.3 118.3 140.0 111.4 139.2 99.6C138.1 81.7 148.5 70.0 165.6 70.0C177.2 70.0 184.5 74.0 189.6 83.2C193.4 90.2 193.8 103.0 190.3 109.6C184.0 121.4 169.7 126.8 156.5 122.2ZM23.7 58.0C10.5 54.7 2.6 44.6 2.6 31.0C2.7 9.8 23.3 -3.0 42.0 6.5C57.9 14.6 61.2 36.5 48.6 50.8C43.6 56.5 31.7 59.9 23.7 58.0Z';
const LOGO=new Path2D(LOGO_D);
document.getElementById('brandMark').innerHTML='<path d="'+LOGO_D+'"/>';
function drawLogo(cx,cy,w,col,glow){const k=w/200;ctx.save();ctx.translate(cx-w/2,cy-64*k);ctx.scale(k,k);
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow/k;}ctx.fillStyle=col;ctx.fill(LOGO);ctx.restore();}
if(document.fonts&&document.fonts.load){document.fonts.load('800 42px "Onest"');document.fonts.load('600 20px "Onest"');document.fonts.load('700 20px "Onest"');}

const OUT='#11151C', SCR='#D3F6FC';
const SIZES=[38,48,60,74,90,108,128,150,174];
// пропорции персонажей (ширина/высота) — тело в физике повторяет силуэт картинки, площадь как у квадрата SIZES
const ASP=[0.932,0.948,0.576,0.648,0.799,0.703,0.622,0.534,0.661];
function dims(t,sc=1){const s=SIZES[t]*sc,q=Math.sqrt(ASP[t]);return [s*q,s/q];}
const NAMES=['Дискета','Кассета','Кирпич','Раскладушка','Плеер','Кнопкофон','Сенсор','Флагман','Раритет'];
const FILLS=['#4B5A70','#C2864E','#3B82F6','#8B7CF6','#E2E8F0','#E0566F','#2A313D','#22D3EE','#161B23'];
const EMO=['sleepy','chill','proud','wink','vibe','smug','cool','rich','star'];
const MAX=SIZES.length-1, POINTS=[0,3,6,10,15,21,28,36,45];
const DROPPABLE=4, LINE_Y=104;
const PB={x:W/2-95,y:452+OY,w:190,h:58};
function inPB(x,y){return x>=PB.x&&x<=PB.x+PB.w&&y>=PB.y&&y<=PB.y+PB.h;}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- ЛИЦА / ГАДЖЕТЫ ----------
function star(cx,cy,r){ctx.beginPath();for(let i=0;i<5;i++){const a=-PI/2+i*2*PI/5;
  ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);const a2=a+PI/5;
  ctx.lineTo(cx+Math.cos(a2)*r*0.45,cy+Math.sin(a2)*r*0.45);}ctx.closePath();
  ctx.fillStyle='#ffd23c';ctx.fill();ctx.lineWidth=Math.max(1.2,r*0.18);ctx.strokeStyle=OUT;ctx.stroke();}
function eye(x,y,kind,R,pdx,pdy){ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(1.6,R*0.34);
  if(kind==='arc'){ctx.beginPath();ctx.arc(x,y,R,0.15*PI,0.85*PI);ctx.stroke();return;}
  if(kind==='line'){ctx.beginPath();ctx.moveTo(x-R,y);ctx.lineTo(x+R,y);ctx.stroke();return;}
  if(kind==='star'){star(x,y,R*1.15);return;}
  const rr2=kind==='wide'?R*1.28:R;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,rr2,0,6.283);ctx.fill();ctx.stroke();
  ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(x+pdx,y+pdy,rr2*0.5,0,6.283);ctx.fill();}
function sunnies(cx,cy,w,R){const lw=w*0.24,lh=R*1.7,ex=w*0.2;ctx.fillStyle=OUT;
  for(const s of [-1,1]){rr(cx+s*ex-lw/2,cy-lh/2,lw,lh,lh*0.4);ctx.fill();}
  ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(2,R*0.4);ctx.beginPath();
  ctx.moveTo(cx-ex+lw/2-2,cy);ctx.lineTo(cx+ex-lw/2+2,cy);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.4)';for(const s of [-1,1]){ctx.beginPath();
    ctx.ellipse(cx+s*ex-lw*0.15,cy-lh*0.15,lw*0.13,lh*0.2,0,0,6.283);ctx.fill();}}
function mouth(cx,my,kind,w,s){ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(1.8,s*0.028);ctx.fillStyle=OUT;
  if(kind==='flat'){ctx.beginPath();ctx.moveTo(cx-w*0.1,my);ctx.lineTo(cx+w*0.1,my);ctx.stroke();return;}
  if(kind==='smile'){ctx.beginPath();ctx.arc(cx,my-s*0.03,w*0.16,0.15*PI,0.85*PI);ctx.stroke();return;}
  if(kind==='grin'){ctx.beginPath();ctx.arc(cx,my-s*0.05,w*0.2,0.08*PI,0.92*PI);ctx.stroke();return;}
  if(kind==='smirk'){ctx.beginPath();ctx.arc(cx+w*0.06,my-s*0.02,w*0.13,0.15*PI,0.8*PI);ctx.stroke();return;}
  if(kind==='open'){ctx.beginPath();ctx.arc(cx,my-s*0.02,w*0.16,0,PI);ctx.closePath();ctx.fillStyle=OUT;ctx.fill();
    ctx.fillStyle='#ff8fa3';ctx.beginPath();ctx.arc(cx,my-s*0.02+w*0.055,w*0.07,0,PI);ctx.fill();return;}}
function face(s,emo,cx,cy,w,h){const R=Math.min(h*0.17,s*0.095),ex=w*0.22,ey=cy-h*0.05;
  if(emo==='rich'){sunnies(cx,ey,w,R);}
  else{let lk='open',rk='open',pdx=0,pdy=R*0.12;
    if(emo==='sleepy'){lk=rk='line';}
    else if(emo==='vibe'){lk=rk='arc';}
    else if(emo==='wink'){lk='open';rk='arc';}
    else if(emo==='star'){lk=rk='star';}
    else if(emo==='excited'){lk=rk='wide';}

  const g=ctx.createRadialGradient(cx,cy,8,cx,cy,r*1.55);g.addColorStop(0,'rgba(34,211,238,'+(0.22+0.08*p)+')');
  g.addColorStop(0.55,'rgba(59,130,246,0.08)');g.addColorStop(1,'rgba(34,211,238,0)');ctx.fillStyle=g;ctx.fillRect(cx-r*1.6,cy-r*1.6,r*3.2,r*3.2);
  const lg=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);lg.addColorStop(0,'#22D3EE');lg.addColorStop(1,'#3B82F6');
  ctx.strokeStyle=lg;ctx.lineCap='round';ctx.shadowColor='#22D3EE';ctx.shadowBlur=16+12*p;
  ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(cx,cy,r,PI*0.8,PI*2.2);ctx.stroke();
  ctx.globalAlpha=0.35;ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r+15,PI*0.86,PI*2.14);ctx.stroke();
  const a=now*0.0009;ctx.globalAlpha=0.9;ctx.fillStyle='#E0FBFF';ctx.shadowBlur=14;   // бегущая искра по кольцу
  ctx.beginPath();ctx.arc(cx+Math.cos(PI*1.5+Math.sin(a)*0.65*PI)*r,cy+Math.sin(PI*1.5+Math.sin(a)*0.65*PI)*r,2.6,0,6.283);ctx.fill();
  ctx.restore();}
function drawFloor(cx,fy,w){ctx.save();ctx.translate(cx,fy);ctx.scale(1,0.16);
  const g=ctx.createRadialGradient(0,0,4,0,0,w);g.addColorStop(0,'rgba(34,211,238,0.45)');g.addColorStop(1,'rgba(34,211,238,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w,0,6.283);ctx.fill();ctx.restore();}
function drawReflection(t,cx,y,sc,fy,h){ctx.save();ctx.beginPath();ctx.rect(0,fy,W,h);ctx.clip();
  ctx.globalAlpha=0.22;ctx.translate(0,2*fy);ctx.scale(1,-1);drawGadget({tier:t,position:{x:cx,y},angle:0},sc);ctx.restore();
  const g=ctx.createLinearGradient(0,fy,0,fy+h);g.addColorStop(0,'rgba(14,17,22,0)');g.addColorStop(1,'rgba(14,17,22,1)');
  ctx.fillStyle=g;ctx.fillRect(cx-110,fy,220,h+1);}
function drawStart(now){const t=now*0.002,bob=Math.sin(now*0.0015)*2,ph=(now*0.0006)%1.8;
  ctx.fillStyle='rgba(8,9,14,0.45)';ctx.fillRect(0,0,W,H);
  drawRain(now);
  ctx.save();ctx.translate(0,OY);ctx.textAlign='center';
  drawLogo(W/2,50,54,'#22D3EE',14);
  ctx.font='800 13px "Onest", system-ui';ctx.letterSpacing='4px';ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText('TECHGIGANT',W/2+2,96);ctx.letterSpacing='-1px';
  ctx.font='800 44px "Onest", system-ui';
  text3D('Эра гаджетов',W/2,142+bob,44,'#ffffff','#22D3EE','#000000','#000000',0,ph);ctx.letterSpacing='0px';
  ctx.font='600 12px "Onest", system-ui';ctx.letterSpacing='3px';
  ctx.fillStyle='#9AA4B2';ctx.fillText('ОТ ДИСКЕТЫ ДО РАРИТЕТА',W/2+1.5,172);ctx.letterSpacing='0px';
  const hy=268,gy=Math.sin(t)*6,hs=0.72,fy=hy+dims(8,hs)[1]/2+10;
  drawHalo(W/2,hy,100,now);drawFloor(W/2,fy,120);
  drawReflection(8,W/2,hy+gy,hs,fy,34);
  drawGadget({tier:8,position:{x:W/2,y:hy+gy},angle:Math.sin(t*0.7)*0.05},hs);
  const strip=[0,2,4,6,8],sx=72,gap=(W-2*sx)/(strip.length-1);
  for(let i=0;i<strip.length;i++){const x=sx+i*gap;
    drawGadget({tier:strip[i],position:{x,y:408},angle:0},0.27);
    if(i<strip.length-1){ctx.fillStyle='rgba(154,164,178,0.5)';ctx.font='700 16px "Onest",system-ui';ctx.textAlign='center';
      ctx.fillText('›',x+gap/2,413);}}
  ctx.restore();
  drawBtn(PB.x,PB.y,PB.w,PB.h,'ИГРАТЬ');
  ctx.fillStyle='rgba(34,211,238,0.85)';ctx.font='600 13px "Onest",system-ui';ctx.textAlign='center';
  ctx.fillText('рекорд: '+best,W/2,PB.y+PB.h+28);}

// ---------- главный цикл ----------
let last=performance.now();
function loop(now){const dt=Math.min(now-last,33);last=now;
  drawBG();drawAmbient(now,dt);
  if(!started){drawStart(now);requestAnimationFrame(loop);return;}
  if(!gameOver&&!paused){Engine.update(engine,1000/60);processMerges();checkOver(dt);comboTimer-=dt;if(comboTimer<=0)combo=0;}
  shake*=0.86;flash*=0.9;const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  const dg=Math.max(dangerLevel,overTimer>0?overTimer/1400:0);
  if(dg>0.01){const grad=ctx.createLinearGradient(0,0,0,LINE_Y);
    grad.addColorStop(0,`rgba(255,70,90,${dg*0.22})`);grad.addColorStop(1,'rgba(255,70,90,0)');
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,LINE_Y);}
  ctx.save();ctx.translate(sx,sy);
  ctx.setLineDash([6,7]);ctx.strokeStyle=`rgba(255,84,104,${0.12+dg*0.75})`;ctx.lineWidth=2;
  ctx.shadowColor='rgba(255,84,104,0.9)';ctx.shadowBlur=dg>0.4?10*dg:0;
  ctx.beginPath();ctx.moveTo(0,LINE_Y);ctx.lineTo(W,LINE_Y);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=0;
  for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.r+=(w.mr-w.r)*0.25;w.life-=0.06;
    if(w.life<=0){waves.splice(i,1);continue;}
    ctx.globalAlpha=w.life*0.6;ctx.strokeStyle=w.c;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,6.283);ctx.stroke();ctx.globalAlpha=1;}
  for(const b of Composite.allBodies(world)){if(b.tier===undefined)continue;let sc=1;
    if(b.pop){const k=(now-b.pop)/170;sc=k<1?(k<0.6?0.55+k*1.0:1.15-(k-0.6)*0.375):1;if(k>=1)b.pop=null;}
    drawGadget(b,sc);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.025;p.rot+=p.vr;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
    if(p.glow){ctx.shadowColor=p.c;ctx.shadowBlur=9;}const ps=p.glow?4:3;
    ctx.fillRect(-ps,-ps,ps*2,ps*2);ctx.strokeStyle=OUT;ctx.lineWidth=1;ctx.strokeRect(-ps,-ps,ps*2,ps*2);ctx.restore();}
  for(let i=texts.length-1;i>=0;i--){const tx=texts[i];tx.y+=tx.vy;tx.life-=0.017;
    if(tx.life<=0){texts.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.min(tx.life*1.6,1);ctx.textAlign='center';
    ctx.font=`700 ${17*tx.s}px "Onest",system-ui`;ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.strokeText(tx.t,tx.x,tx.y);
    ctx.fillStyle=tx.c;ctx.fillText(tx.t,tx.x,tx.y);ctx.restore();}
  if(!gameOver){const s=dims(held)[0],x=Math.max(s/2+2,Math.min(W-s/2-2,pointerX));
    ctx.save();ctx.globalAlpha=0.45;ctx.strokeStyle='rgba(34,211,238,0.9)';ctx.setLineDash([3,6]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,72);ctx.lineTo(x,H);ctx.stroke();ctx.restore();
    drawGadget({tier:held,position:{x,y:50},angle:0});}
  ctx.restore();
  if(flash>0.01){ctx.save();ctx.globalAlpha=Math.min(flash*0.32,0.5);ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.restore();}
  if(aiming&&!gameOver){ctx.save();ctx.fillStyle='rgba(34,211,238,0.06)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.font='700 14px "Onest",system-ui';ctx.fillStyle='#22D3EE';
    ctx.fillText(PW[aiming].hint,W/2,LINE_Y+28);ctx.restore();}
  if(combo>=3&&!gameOver){ctx.save();ctx.globalAlpha=Math.min(comboTimer/520,1);ctx.textAlign='center';
    const cf=combo,fs=30+Math.min(cf,10)*3,col=cf>=7?'#ffd23c':cf>=5?'#3B82F6':'#22D3EE';
    ctx.shadowColor=col;ctx.shadowBlur=10+cf*2;ctx.font='800 '+fs+'px "Onest",system-ui';
    text3D('КОМБО x'+cf,W/2,H/2,fs,'#ffffff',col,'#000000','#000000',0,(now*0.001)%1.8);ctx.restore();}
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='600 10px "Onest",system-ui';ctx.textAlign='left';
  ctx.fillText('далее',14,18);drawGadget({tier:next,position:{x:30,y:44},angle:0},0.45);
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!gameOver&&!paused)setPause(true);if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});
</script>
